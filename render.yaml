services:
  - type: web
    name: health-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false           # Set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel frontend URL in the dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
